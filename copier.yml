_min_copier_version: "9.4.0"
_subdirectory: scaffold
_preserve_symlinks: true
_skip_if_exists: [.chrono-harness/rules.json]
_answers_file: .chrono-harness/template-answers.yml
published_instruction_feeds:
  type: yaml
  when: false
  default: !include .chrono-harness/published-rules.json
host_release_artifact:
  type: yaml
  when: false
  default:
    version: "0.1.12-alpha.1"
    linux_sha256: "06f52284ad8b12a71d2402f9b844863af1a10f123b6373f6373b064487da7ab4"
    macos_sha256: "148ca8ee0ba4bfb688799aae65b73a9bdd36ac3c0e03d47cade37fc1da48089e"
install_resolver_artifact:
  type: yaml
  when: false
  default:
    version: "0.1.4"
    linux_sha256: "e955b761c6d1819c3710faef74746ecac84d9ee5e9a051c09a67aafe82cde595"
    macos_sha256: "01b08b48bf432e21c8f53be131f9320b008a125344bc8b56a4b30a3fd9c3ae0b"
tool_dependencies:
  type: yaml
  when: false
  default:
    cache: [chrono-cache, chrono-harness]
    ci: [chrono-ci]
    diagnostics: [chrono-diagnostics]
    distribution: [chrono-distribution]
    harness: [chrono-harness]
    host-bootstrap: [chrono-harness, chrono-host-bootstrap, chrono-judge-registration]
    host-release: [chrono-harness, chrono-host-bootstrap, chrono-host-release, chrono-judge-registration]
    inputs: [chrono-harness, chrono-inputs, chrono-judge-filemap, chrono-judge-mixed, chrono-judge-registration, chrono-judge-routes]
    instructions: [chrono-instructions]
    judge-ci: [chrono-harness, chrono-judge-ci, chrono-judge-filemap, chrono-judge-mixed, chrono-judge-projects, chrono-judge-registration, chrono-judge-routes]
    judge-cost: [chrono-harness, chrono-judge-cost, chrono-judge-filemap, chrono-judge-registration]
    judge-filemap: [chrono-harness, chrono-judge-filemap, chrono-judge-mixed, chrono-judge-registration]
    judge-mixed: [chrono-harness, chrono-judge-mixed, chrono-judge-registration]
    judge-projects: [chrono-harness, chrono-judge-filemap, chrono-judge-projects, chrono-judge-registration, chrono-judge-routes]
    registration: [chrono-harness, chrono-judge-registration, chrono-judge-routes]
    judge-routes: [chrono-harness, chrono-judge-filemap, chrono-judge-registration, chrono-judge-routes]
    judge-workflow: [chrono-harness, chrono-judge-projects, chrono-judge-registration, chrono-judge-routes, chrono-judge-workflow]
    pr: [chrono-pr]
    test-git: [chrono-test-git, chrono-test-git-profile]
    worktree: [chrono-worktree]
    verus: [rust, verus]
features:
  type: str
  multiselect: true
  help: 默认安装全部工具。按空格取消本仓不需要的工具，回车确认。组件介绍见 https://github.com/chrono-harness/chrono-harness-main
  default: "{{ tool_dependencies | list }}"
  choices: "{{ tool_dependencies | list }}"
project_guide:
  type: str
  multiline: true
  default: ""
  help: 本仓职责、源码位置和验证入口（可选，可直接在根指南追加）。
strict_host_adapters:
  type: yaml
  default: {}
  help: 选装严格模板部署检查时填写 verus_macro_crate。另填 binary 和 ci_tools 可验证对应的 CI 启动器与标签发布工作流。
  validator: |
    {%- if strict_host_adapters -%}
    {%- set a = strict_host_adapters -%}
    {%- if a is not mapping or a.keys() | sort not in [['verus_macro_crate'], ['binary', 'ci_tools', 'verus_macro_crate']]
        or not (a.verus_macro_crate is string and a.verus_macro_crate | regex_search('^[a-z][a-z0-9_]*$')) -%}
    请填写 verus_macro_crate；验证 CI 和发布入口时还需同时填写 binary 与 ci_tools
    {%- elif a.binary is defined -%}
    {%- if not (a.binary is string and a.binary | regex_search('^[a-z][a-z0-9-]*$'))
        or a.ci_tools is string or a.ci_tools is mapping or not (a.ci_tools is sequence and a.ci_tools | length)
        or a.ci_tools | unique | list | length != a.ci_tools | length -%}
    请填写有效的发布程序名与非空且唯一的 CI 工具清单
    {%- else -%}
    {%- for tool in a.ci_tools if not (tool is string and tool | regex_search('^[a-z][a-z0-9-]*$')) -%}
    CI 工具名只接受小写字母、数字和连字符
    {%- endfor -%}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}
local_check_retention:
  type: bool
  default: false
  help: 本地检查会向 runner 登记原件，并需要使用 runner 维护它们吗？已有专属维护入口的宿主可以继续沿用。
native_check_keep_seconds:
  type: int
  default: 0
  help: 原生开发检查的临时编译目录保留多少秒？0 关闭，86400 为一天。宿主通过 host-bootstrap 的 native-scratch run 运行原生检查。
  validator: "{{ '原生检查目录保留秒数必须在 0 到 18446744073709551615 之间' if native_check_keep_seconds < 0 or native_check_keep_seconds > 18446744073709551615 else '' }}"
expire_local_check_slots:
  when: "{{ local_check_retention }}"
  type: json
  default: []
  help: 选择可在窗口到期后释放的成功本地完整检查报告，填宿主登记的固定报告相对路径数组。默认空。
  validator: |
    {%- set slots = expire_local_check_slots -%}
    {%- if slots is string or slots is mapping or slots is not sequence -%}
    报告路径必须是数组
    {%- elif slots | select('string') | list | length != slots | length -%}
    每项报告路径都必须是字符串
    {%- elif slots | unique(case_sensitive=true) | list | length != slots | length -%}
    报告路径必须唯一
    {%- else -%}
    {%- for slot in slots -%}
    {%- set parts = slot.split('/') -%}
    {%- if not slot.startswith('.chrono-harness/state/')
        or slot | regex_search('[\\\\\\x00-\\x1f*?\\[\\]]')
        or '' in parts or '.' in parts or '..' in parts -%}
    必须填写 .chrono-harness/state/ 下面的固定文件路径
    {%- endif -%}
    {%- endfor -%}
    {%- endif -%}
generate_check:
  type: bool
  default: false
  help: 是否为业务检查生成本地命令和 GitHub Actions？已有检查入口的仓库可以保留自己的工作流。
check_command:
  type: str
  when: "{{ generate_check }}"
  default: ./check.sh
  help: 仓库已有的业务检查命令
  validator: "{% if not check_command.strip() %}请输入业务检查命令{% endif %}"
repository:
  type: str
  default: ""
  help: GitHub 仓库 owner/name（选用 pr 时必填，其他仓库可以留空）
  validator: "{% if ('pr' in features or repository) and not (repository | regex_search('^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$')) %}请输入 owner/name{% endif %}"
dev_branch:
  type: str
  default: dev
  help: 开发分支。正式版使用 main。
required_check:
  type: str
  when: "{{ 'pr' in features }}"
  default: check
  help: PR 状态需要核对的 GitHub 检查名
check_os:
  type: str
  when: "{{ generate_check }}"
  help: 业务检查在哪个平台执行？
  default: ubuntu-24.04
  choices: [ubuntu-24.04, macos-15]
dependabot_updates:
  type: yaml
  default: []
  help: GitHub Dependabot v2 的 updates 列表。填写生态、目录及频率，空列表关闭。
  validator: >-
    {% if dependabot_updates is not sequence or dependabot_updates is string or dependabot_updates is mapping
       or dependabot_updates | reject("mapping") | list %}请提供 Dependabot updates 对象列表{% endif %}
dependabot_auto_merge:
  type: bool
  default: true
  when: "{{ dependabot_updates | length > 0 }}"
  help: 本仓 Dependabot PR 通过开发分支的必需检查后自动合并？
check_landed_dependencies:
  type: bool
  default: false
  when: "{{ dependabot_updates and dependabot_auto_merge and dev_branch == 'dev' }}"
  help: 为采用 chrono-harness 本地 DELTA 入口（./check.sh）的宿主，在依赖自动合并后按第一父提交运行落地检查。
github_templates:
  type: bool
  help: 安装 GitHub Issue 表单及 PR 模板？
  default: true
manage_roadmap:
  type: bool
  default: true
  help: 使用本仓 GitHub Issues、Milestones 和公开发行自动维护版本路线图。
roadmap_actions_lock:
  type: bool
  default: false
  when: "{{ manage_roadmap and strict_host_adapters and dependabot_updates | selectattr('package-ecosystem', 'defined') | selectattr('package-ecosystem', 'equalto', 'github-actions') | list | length > 0 }}"
  help: 严格验证路线图时，使用 GitHub 原生 actions.lock 管理 checkout 和 github-script 的版本？
publisher_workflow:
  type: str
  when: "{{ manage_roadmap }}"
  default: Release
  help: 本仓发布工作流的 name。GitHub Actions 发布完成后用它同步路线图。
release_plan:
  type: json
  default: {}
  help: 可选的独立发布配置。填写版本、产品类型、开发检查和真实下游验收。留空可沿用宿主已有的发布方式。
  validator: |
    {%- if release_plan -%}
    {%- set p = release_plan -%}
    {%- if p is not mapping or p.kind not in ["copier", "binary"] or not (p.version | default("") | regex_search("^[0-9]+[.][0-9]+[.][0-9]+$"))
        or p.check is not mapping or not p.check.name or not p.check.file
        or p.consumer is not mapping or not p.consumer.repository or not p.consumer.branch or not p.consumer.workflow
        or not p.consumer.pin or not p.consumer.jobs or p.consumer.jobs is string or not p.consumer.step -%}
    请填写 kind、version、check 和完整的 consumer 验收配置
    {%- elif p.version_policy | default("explicit") not in ["explicit", "next_patch"] or (p.version_policy | default("explicit") == "next_patch" and p.kind != "copier") -%}
    next_patch 只适用于 Copier 源码发布
    {%- elif p.kind == "binary" and (not (p.binary | default("") | regex_search("^[A-Za-z0-9_-]+$"))
         or not (p.build | default("") | regex_search("^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$"))
         or ".." in p.build.split("/")) -%}
    请填写二进制名称 binary 和宿主内的构建入口 build
    {%- endif -%}
    {%- endif -%}

tool_install_channels:
  type: str
  default: pinned
  help: 默认选用固定配方 pinned、最新正式版 stable、最新测试版 preview 或精确 v 标签。
  validator: >-
    {{ '' if tool_install_channels in ('pinned', 'stable', 'preview')
       or tool_install_channels | regex_search('^v[0-9]+[.][0-9]+[.][0-9]+(-[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*)?\\Z')
       else '需要 pinned、stable、preview 或精确 v 版本标签' }}
tool_versions:
  type: json
  default: {}
  help: 按命令选择 stable、preview 或精确的 v 标签，例如 {"chrono-pr":"stable","chrono-diagnostics":"v0.1.0"}。
  validator: |
    {%- if tool_versions is not mapping -%}需要工具命令名到精确标签的对象
    {%- else -%}
    {%- set selected = namespace(commands=['chrono-harness'] if local_check_retention else []) -%}
    {%- if native_check_keep_seconds -%}{%- set selected.commands = selected.commands + ['chrono-host-bootstrap'] -%}{%- endif -%}
    {%- for f in features -%}{%- set selected.commands = selected.commands + tool_dependencies[f] -%}{%- endfor -%}
    {%- for command, tag in tool_versions.items() -%}
    {%- if command not in selected.commands or not command.startswith('chrono-') or tag is not string or (tag not in ('stable', 'preview') and not (tag | regex_search('^v[0-9]+[.][0-9]+[.][0-9]+(-[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*)?\\Z'))) -%}需要已选组织工具名和 stable、preview 或精确 v 版本标签
    {%- endif -%}{%- endfor -%}{%- endif -%}
