name: Release
on:
  workflow_run:
    workflows: ["Copier"]
    types: [completed]
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false
jobs:
  source:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      preview: ${{ steps.plan.outputs.preview }}
      proof: ${{ steps.plan.outputs.proof }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the release verifier
        shell: bash
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/release-tool.XXXXXXXX")
          curl --fail --silent --show-error --location "https://github.com/chrono-harness/chrono-harness-host-release/releases/download/v0.1.0-alpha.20/chrono-host-release-linux-x86_64" -o "$directory/chrono-host-release"
          (cd "$directory" && echo "4d78c6ad1e40b61d8a0a8c316f7bf72995be4553bf6d5d22ee515d20415fe4d0  chrono-host-release" | sha256sum --check --status)
          chmod 755 "$directory/chrono-host-release"
          echo "$directory" >> "$GITHUB_PATH"

      - name: Install the Copier answers parser
        run: |
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/release-python/bin" >> "$GITHUB_PATH"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release/plan.py
  publish:
    needs: source
    if: >-
      needs.source.result == 'success' && needs.source.outputs.mode != 'complete'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-${{ needs.source.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the release verifier
        shell: bash
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/release-tool.XXXXXXXX")
          curl --fail --silent --show-error --location "https://github.com/chrono-harness/chrono-harness-host-release/releases/download/v0.1.0-alpha.20/chrono-host-release-linux-x86_64" -o "$directory/chrono-host-release"
          (cd "$directory" && echo "4d78c6ad1e40b61d8a0a8c316f7bf72995be4553bf6d5d22ee515d20415fe4d0  chrono-host-release" | sha256sum --check --status)
          chmod 755 "$directory/chrono-host-release"
          echo "$directory" >> "$GITHUB_PATH"

      - name: Verify and publish the selected release
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.source.outputs.mode }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          TAG: ${{ needs.source.outputs.tag }}
          PREVIEW: ${{ needs.source.outputs.preview }}
          PROOF: ${{ needs.source.outputs.proof }}
          DIST: ${{ runner.temp }}/dist
        run: python3 .github/release/publish.py
