name: Check landed Copier dependency
on:
  workflow_run:
    workflows: [CodeQL]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      codeql_attempt:
        description: Completed CodeQL run ID/attempt for the landed dependency
        required: true
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: source
        run: python3 .github/landed_dependency.py
  check-landing:
    needs: source
    if: needs.source.outputs.sha != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - run: pipx install uv
      - run: ./tests/check.sh
