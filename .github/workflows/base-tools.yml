name: Install base tools
on:
  push:
    paths: [.chrono-harness/install-tools.sh, .chrono-harness/install-policy.sh, .config/mise/conf.d/chrono-harness.toml, .github/workflows/base-tools.yml]
  pull_request:
    paths: [.chrono-harness/install-tools.sh, .chrono-harness/install-policy.sh, .config/mise/conf.d/chrono-harness.toml, .github/workflows/base-tools.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
        with:
          version: 2026.11.12
          cache: false
          install: false
      - run: mise run harness-setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run the installed commands
        shell: bash
        run: |
          set -euo pipefail
          mise ls --current
          verus --version
          chrono-pr pr-reminders
          grep -Fxq '<!-- chrono-instructions:begin -->' CLAUDE.md
          test ! -e .chrono-harness/instructions/catalog.json
          test "$(readlink AGENTS.md)" = CLAUDE.md
